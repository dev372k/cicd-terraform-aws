name: Deploy Docker App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            
            docker pull owais372k/sample-fastapi-backend:latest

            docker stop sample-fastapi-backend || true
            docker rm sample-fastapi-backend || true

            docker run -d \
              --name sample-fastapi-backend \
              -p 80:8080 \
              --restart always \
              owais372k/sample-fastapi-backend:latest