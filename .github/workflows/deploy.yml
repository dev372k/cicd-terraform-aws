name: Deploy Docker App

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: owais372k/sample-fastapi-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # SETUP BUILDX
      # ----------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------
      # LOGIN TO DOCKER HUB
      # ----------------------------
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # ----------------------------
      # BUILD & PUSH
      # ----------------------------
      - name: Build and Push Docker Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$IMAGE_TAG \
            --push .

      # ----------------------------
      # DEPLOY
      # ----------------------------
      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
              docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

              docker pull owais372k/sample-fastapi-backend:${{ github.sha }}

              docker stop sample-fastapi-backend || true
              docker rm sample-fastapi-backend || true

              docker run -d \
                  --name sample-fastapi-backend \
                  -p 80:8000 \
                  -e APP_NAME="sample backend server" \
                  -e VERSION=1.0.6 \
                  -e ENVIRONMENT=DEV \
                  -e LOG_LEVEL=INFO \
                  --restart always \
                  owais372k/sample-fastapi-backend:${{ github.sha }}
