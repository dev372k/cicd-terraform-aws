name: Deploy Docker App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # SETUP DOCKER BUILD (MULTI-ARCH)
      # ----------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------
      # LOGIN TO DOCKER HUB
      # ----------------------------
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # ----------------------------
      # BUILD & PUSH IMAGE
      # ----------------------------
      - name: Build and Push Docker Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t owais372k/sample-fastapi-backend:latest \
            --push .

      # ----------------------------
      # DEPLOY TO SERVER
      # ----------------------------
      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            docker pull owais372k/sample-fastapi-backend:latest

            docker stop sample-fastapi-backend || true
            docker rm sample-fastapi-backend || true

            docker run -d \
              --name sample-fastapi-backend \
              -p 80:8080 \
              --restart always \
              owais372k/sample-fastapi-backend:latest